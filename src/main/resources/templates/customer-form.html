<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer form</title>

    <style>
        .error {color:red}
    </style>
</head>
<body>
<i>Fill our the form. Asterisk(*) means required.</i>

<form th:action="@{/processFrom}" th:object="${customer}" method="POST">
    First name: <input type="text" th:field="*{firstName}" />

    <br><br>

    Last name (*): <input type="text" th:field="*{lastName}" />

    <!-- Add error message (if present) -->
    <span th:if="${#fields.hasErrors('lastName')}"
          th:errors="*{lastName}"
          class="error"></span>

    <br><br>


    Free Passes(*): <input type="text" th:field="*{freePasses}"/>

    <span th:if="${#fields.hasErrors('freePasses')}"
          th:errors="*{freePasses}"
          class="error"></span>

    <br><br>

    PinCode: <input type="text" th:field="*{pinCode}"/>

    <span th:if="${#fields.hasErrors('pinCode')}"
    th:errors="*{pinCode}"
    class="error"></span>



    <br><br>

    Course Code:<input type="text" th:field="*{courseCode}"/>

    <span th:if="${#fields.hasErrors('courseCode')}"
          th:errors="*{courseCode}"
          class="error"></span>


    <input type="submit" value="Submit"/>

</form>

</body>
</html>
